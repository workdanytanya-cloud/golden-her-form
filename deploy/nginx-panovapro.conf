server {
    listen 80;
    listen [::]:80;
    server_name ВАШ_ДОМЕН.ru www.ВАШ_ДОМЕН.ru;

    client_max_body_size 50M;

    # Пересборка рациона занимает до двух поисков по 45 с. Без этого nginx
    # отдаёт HTML 504, и кабинет показывает Unexpected token '<'.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        error_page 502 504 = @panovapro_api_gateway;
    }

    location @panovapro_api_gateway {
        internal;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 504 '{"error":{"code":"gateway_timeout","message":"Сервер не успел ответить. Повторите попытку."}}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
